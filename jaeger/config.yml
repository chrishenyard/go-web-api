extensions:
  jaeger_storage:
    backends:
      memory_backend:
        memory:
          max_traces: 100000
  jaeger_query:
    storage:
      traces: memory_backend
    http:
      endpoint: jaeger:16686
      tls:
        cert_file: /etc/jaeger/certs/jaeger-server.crt
        key_file: /etc/jaeger/certs/jaeger-server.key

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: jaeger:4317
        tls:
          cert_file: /etc/jaeger/certs/jaeger-server.crt
          key_file: /etc/jaeger/certs/jaeger-server.key
          ca_file: /etc/jaeger/certs/localhost-ca.crt

processors:
  # Identical memory protector to your OTel config
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 15
  batch:
    timeout: 10s
    send_batch_size: 1
    send_batch_max_size: 500

exporters:
  # Instead of sending to an external URL, it writes locally to the extension above
  jaeger_storage_exporter:
    trace_storage: memory_backend

service:
  extensions: [jaeger_storage, jaeger_query]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [jaeger_storage_exporter]
