receivers:
  otlp:
    protocols:
      grpc:
        endpoint: otel-collector:4317
        tls:
          cert_file: /etc/otelcol-contrib/certs/otel-collector-server.crt
          key_file: /etc/otelcol-contrib/certs/otel-collector-server.key
          ca_file: /etc/otelcol-contrib/certs/localhost-ca.crt

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 15
  batch:
    timeout: 10s
    send_batch_size: 1
    send_batch_max_size: 500

exporters:
  debug:
    verbosity: detailed

  # Exposes Collector metrics for Prometheus.
  prometheus:
    endpoint: otel-collector:8889
    tls:
      cert_file: /etc/otelcol-contrib/certs/otel-collector-client.crt
      key_file: /etc/otelcol-contrib/certs/otel-collector-client.key
      ca_file: /etc/otelcol-contrib/certs/localhost-ca.crt

  # Export traces to Jaeger over OTLP/gRPC using mTLS.
  # This assumes Jaeger's OTLP receiver on :4317 is configured for TLS/mTLS.
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      ca_file: /etc/otelcol-contrib/certs/localhost-ca.crt
      cert_file: /etc/otelcol-contrib/certs/otel-collector-client.crt
      key_file: /etc/otelcol-contrib/certs/otel-collector-client.key

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    tls:
      cert_file: /etc/otelcol-contrib/certs/otel-collector-server.crt
      key_file: /etc/otelcol-contrib/certs/otel-collector-server.key

service:
  extensions: [health_check]

  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, otlp/jaeger]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, prometheus]

    # Jaeger stores traces, not logs. Keep logs in the debug exporter until
    # a log backend such as Loki is added.
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
