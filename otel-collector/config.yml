receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        tls:
          cert_file: /etc/otelcol-contrib/certs/otel-collector.crt
          key_file: /etc/otelcol-contrib/certs/otel-collector.key
          client_ca_file: /etc/otelcol-contrib/certs/localhost-ca.crt

      http:
        endpoint: 0.0.0.0:4318
        tls:
          cert_file: /etc/otelcol-contrib/certs/otel-collector.crt
          key_file: /etc/otelcol-contrib/certs/otel-collector.key
          client_ca_file: /etc/otelcol-contrib/certs/localhost-ca.crt

processors:
  batch:

exporters:
  debug:
    verbosity: detailed

  # Exposes Collector metrics for Prometheus.
  prometheus:
    endpoint: 0.0.0.0:8889
    tls:
      cert_file: /etc/otelcol-contrib/certs/otel-collector.crt
      key_file: /etc/otelcol-contrib/certs/otel-collector.key
      client_ca_file: /etc/otelcol-contrib/certs/localhost-ca.crt

  # Export traces to Jaeger over OTLP/gRPC using mTLS.
  # This assumes Jaeger's OTLP receiver on :4317 is configured for TLS/mTLS.
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      ca_file: /etc/otelcol-contrib/certs/localhost-ca.crt
      cert_file: /etc/otelcol-contrib/certs/otel-collector.crt
      key_file: /etc/otelcol-contrib/certs/otel-collector.key

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    tls:
      cert_file: /etc/otelcol-contrib/certs/otel-collector.crt
      key_file: /etc/otelcol-contrib/certs/otel-collector.key

service:
  extensions: [health_check]

  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp/jaeger]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, prometheus]

    # Jaeger stores traces, not logs. Keep logs in the debug exporter until
    # a log backend such as Loki is added.
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
