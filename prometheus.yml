global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'otel-collector'
    scheme: https
    scrape_interval: 5s

    tls_config:
      # Verify the Collector's server certificate with the private CA.
      ca_file: /etc/prometheus/certs/localhost-ca.crt

      # Present Prometheus' client identity to the Collector.
      cert_file: /etc/prometheus/certs/prometheus.crt
      key_file: /etc/prometheus/certs/prometheus.key

      insecure_skip_verify: false

    static_configs:
      - targets: ['otel-collector:8889']
