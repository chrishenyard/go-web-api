services:
  # Your Go Web Application
  # Ensure your Go app serves Prometheus metrics on port 8081 at /metrics
  go-web-api:
    image: go-web-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go-web-api
    ports:
      - "8081:8081"
    secrets:
      - env_file
    environment:
      - PORT=${PORT:-8081}
      - VAULT_ADDR=${VAULT_ADDR}
      - VAULT_AUTH_METHOD=${VAULT_AUTH_METHOD}
      - VAULT_KUBERNETES_JWT_PATH=${VAULT_KUBERNETES_JWT_PATH}
      - VAULT_MOUNT_POINT=${VAULT_MOUNT_POINT}
      - VAULT_ROLE_ID=${VAULT_ROLE_ID}
      - VAULT_ROLE_NAME=${VAULT_ROLE_NAME}
      - VAULT_SECRET_ID=
      - VAULT_SECRET_PATH=${VAULT_SECRET_PATH}
      - VAULT_ALLOW_INVALID_SERVER_CERTIFICATE=${VAULT_ALLOW_INVALID_SERVER_CERTIFICATE}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_ISSUER_URL=https://keycloak.localhost:8443/realms/Golang_Private
      - OIDC_REALM=${OIDC_REALM}
      - HOST=0.0.0.0
      - REDIRECT_HOST=${REDIRECT_HOST}
      - LOG_LEVEL=${LOG_LEVEL}
      - SERVICE_NAME=${SERVICE_NAME}
      - LOGIN_SUCCESS_URL=${LOGIN_SUCCESS_URL}
      - POST_LOGOUT_REDIRECT_URL=${POST_LOGOUT_REDIRECT_URL}
      # HTTPS certificate used by the application's browser-facing web server.
      - CERT_FILE_PATH=/app/certs/localhost.crt
      - KEY_FILE_PATH=/app/certs/localhost.key
      - ENV_FILE_PATH=/run/secrets/env_file
      # OTLP gRPC mTLS. The CA verifies the Collector and the client certificate
      # identifies this Go service to the Collector.      
      # Jaeger requires the environment variable OTEL_ENABLED to be set to true for the OpenTelemetry SDK to send traces to the Collector.
      - OTEL_EXPORTER_OTLP_TIMEOUT=2000
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=https://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_EXPORTER_OTLP_INSECURE=false
      - OTEL_EXPORTER_OTLP_CERTIFICATE=/app/certs/localhost-ca.crt
      - OTEL_EXPORTER_OTLP_CLIENT_CERTIFICATE=/app/certs/localhost.crt
      - OTEL_EXPORTER_OTLP_CLIENT_KEY=/app/certs/localhost.key
      # Keep the private CA available to other TLS clients used by the app.
      - SSL_CERT_DIR=/app/certs
    volumes:
      - ./certs:/app/certs:ro
    extra_hosts:
      - "vault.localhost:host-gateway"
      - "keycloak.localhost:host-gateway"
    networks:
      - monitoring
    restart: unless-stopped
    depends_on:
      otel-collector:
        condition: service_started

  network-tools:
    image: nicolaka/netshoot
    command: sleep infinity
    volumes:
      - ./certs:/app/certs:ro
    network_mode: "service:go-web-api"  # Shares the exact network namespace of go-web-api
    depends_on:
      - go-web-api

  otel-collector:
    image: ${COLLECTOR_CONTRIB_IMAGE}
    container_name: otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes:
      - ./otel-collector/config.yml:/etc/otelcol-contrib/config.yml:ro
      - ./certs:/etc/otelcol-contrib/certs:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus metrics
      - "13133:13133" # Health check
    restart: unless-stopped  
    networks:
      - monitoring
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    depends_on:
      jaeger:
        condition: service_started

  prometheus:
    image: ${PROMETHEUS_IMAGE}
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/prometheus-web.yml:/etc/prometheus/web.yml:ro
      - ./certs:/etc/prometheus/certs:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"  
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.config.file=/etc/prometheus/web.yml'
      - '--storage.tsdb.path=/prometheus'      
    networks:
      - monitoring
    restart: unless-stopped

  jaeger:
    image: ${JAEGERTRACING_IMAGE}
    container_name: jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - LOG_LEVEL=debug
    command: 
      - "--config=/etc/jaeger/config.yml"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    volumes:
      - ./jaeger/config.yml:/etc/jaeger/config.yml:ro
      - ./certs:/etc/jaeger/certs:ro
    ports:
      - "16686:16686" # UI
    networks:
      - monitoring

