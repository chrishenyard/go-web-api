receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        tls:
          cert_file: /etc/otelcol-contrib/certs/otel-collector.crt
          key_file: /etc/otelcol-contrib/certs/otel-collector.key
          client_ca_file: /etc/otelcol-contrib/certs/localhost-ca.crt
      http:
        endpoint: 0.0.0.0:4318
        tls:
          cert_file: /etc/otelcol-contrib/certs/otel-collector.crt
          key_file: /etc/otelcol-contrib/certs/otel-collector.key
          client_ca_file: /etc/otelcol-contrib/certs/localhost-ca.crt

processors:
  batch:

exporters:
  debug:
    verbosity: detailed

  # Prometheus scrapes this endpoint. The Collector is the TLS server here,
  # so client_ca_file makes Prometheus client-certificate authentication mandatory.
  prometheus:
    endpoint: 0.0.0.0:8889
    tls:
      cert_file: /etc/otelcol-contrib/certs/otel-collector.crt
      key_file: /etc/otelcol-contrib/certs/otel-collector.key
      client_ca_file: /etc/otelcol-contrib/certs/localhost-ca.crt

  # The Collector is the TLS client when exporting traces to Jaeger.
  # ca_file verifies Jaeger; cert_file/key_file identify the Collector to Jaeger.
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      ca_file: /etc/otelcol-contrib/certs/localhost-ca.crt
      cert_file: /etc/otelcol-contrib/certs/otel-collector.crt
      key_file: /etc/otelcol-contrib/certs/otel-collector.key

extensions:
  # Keep the health endpoint as ordinary TLS. Requiring a client certificate here
  # would make Docker/Kubernetes health probes unnecessarily difficult.
  health_check:
    endpoint: 0.0.0.0:13133
    tls:
      cert_file: /etc/otelcol-contrib/certs/otel-collector.crt
      key_file: /etc/otelcol-contrib/certs/otel-collector.key

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp/jaeger]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, prometheus]

    # Jaeger stores traces, not logs. Keep logs visible in the Collector debug
    # exporter until a log backend (for example Loki) is added.
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
